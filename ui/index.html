<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM Salon</title>
    <style>
      :root {
        --bg: #f7f4ef;
        --ink: #1c1c1c;
        --muted: #5b5b5b;
        --accent: #0b6b5d;
        --accent-2: #d9730d;
        --panel: #ffffff;
        --panel-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        --border: #e5dfd4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Orbitron", "Eurostile", "Futura", "OCR A Std", "Trebuchet MS", sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 10% 20%, #fff4df, transparent 45%),
          radial-gradient(circle at 90% 0%, #e6f3f0, transparent 40%),
          var(--bg);
        min-height: 100vh;
      }

      header {
        padding: 32px 20px 12px;
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: 0.4px;
      }

      p.lead {
        margin: 0;
        color: var(--muted);
      }

      .shell {
        max-width: 1200px;
        margin: 0 auto 40px;
        padding: 20px;
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 18px;
      }

      @media (max-width: 900px) {
        .shell {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        box-shadow: var(--panel-shadow);
      }

      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      textarea,
      input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 14px;
        font-family: inherit;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      .actions {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      button {
        background: var(--accent);
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .status {
        color: var(--muted);
        font-size: 13px;
      }

      .chat {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 360px;
        max-height: 60vh;
        overflow-y: auto;
        padding: 4px;
      }

      .turn {
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #faf8f5;
        animation: fadeIn 0.4s ease-out forwards;
      }

      .turn h3 {
        margin: 0 0 6px;
        font-size: 14px;
        color: var(--accent);
      }

      .summary {
        border-left: 4px solid var(--accent-2);
        background: #fff7ed;
      }

      .composer {
        border-top: 1px dashed var(--border);
        padding-top: 12px;
      }

      .sidebar h2 {
        margin: 0 0 12px;
        font-size: 16px;
        letter-spacing: 0.8px;
      }

      .conversation-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 70vh;
        overflow-y: auto;
      }

      .conversation {
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #fdfaf4;
        cursor: pointer;
      }

      .conversation.active {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px rgba(11, 107, 93, 0.3);
      }

      .conversation-title {
        font-size: 13px;
        font-weight: 600;
      }

      .conversation-meta {
        margin-top: 4px;
        font-size: 11px;
        color: var(--muted);
      }

      .auth-panel {
        display: grid;
        gap: 10px;
        margin-bottom: 14px;
      }

      .auth-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .auth-row input {
        flex: 1;
      }

      .pill {
        padding: 6px 10px;
        border-radius: 999px;
        background: #eef5f3;
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
      }

      .topbar {
        position: absolute;
        top: 20px;
        right: 20px;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .topbar button {
        background: #1a1a1a;
      }

      .dropdown {
        position: relative;
      }

      .dropdown-menu {
        position: absolute;
        right: 0;
        top: 44px;
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--panel-shadow);
        min-width: 180px;
        display: none;
        z-index: 10;
      }

      .dropdown-menu button {
        background: transparent;
        color: var(--ink);
        padding: 10px 12px;
        border: none;
        width: 100%;
        text-align: left;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }

      .modal {
        width: min(420px, 90vw);
        background: #fff;
        border-radius: 16px;
        padding: 18px;
        box-shadow: var(--panel-shadow);
      }

      .modal h3 {
        margin: 0 0 12px;
      }

      .modal-actions {
        margin-top: 12px;
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      .activity-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 50vh;
        overflow-y: auto;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>LLM Salon</h1>
      <p class="lead">Drop in a prompt and watch the conversation unfold.</p>
    </header>
    <div class="topbar">
      <button id="buyBtnTop" type="button">Buy credits</button>
      <button id="signInBtn" type="button">Sign in</button>
      <div class="dropdown" id="userMenu" style="display: none;">
        <button id="userBtn" type="button">user@email.com</button>
        <div class="dropdown-menu" id="userMenuList">
          <button type="button" id="activityBtn">Activity</button>
          <button type="button" id="buyBtnMenu">Buy more credits</button>
          <button type="button" id="signOutBtn">Sign out</button>
        </div>
      </div>
    </div>
    <div class="shell">
      <aside class="panel sidebar">
        <h2>Prior Debates</h2>
        <div class="conversation-list" id="conversationList">
          <div class="status">Enter an email to load history.</div>
        </div>
      </aside>
      <main class="panel">
        <section class="chat" id="results">
          <div class="status">Start by typing a topic.</div>
        </section>
        <section class="composer">
          <label for="topic">Your prompt</label>
          <textarea id="topic" placeholder="Ask a focused question to kick off the debate..."></textarea>
          <div class="actions">
            <button id="runBtn">Send</button>
            <button id="moreBtn" type="button">Continue</button>
            <span class="status" id="status"></span>
          </div>
        </section>
      </main>
    </div>

    <div class="modal-backdrop" id="authModal">
      <div class="modal">
        <h3>Sign in or sign up</h3>
        <label for="email">Email</label>
        <input id="email" type="text" placeholder="you@domain.com" />
        <label for="code" style="margin-top: 8px;">Code</label>
        <input id="code" type="text" placeholder="Enter code" />
        <div class="status" id="authStatus"></div>
        <div class="modal-actions">
          <button id="sendCodeBtn" type="button">Send code</button>
          <button id="codeBtn" type="button">Verify</button>
          <button id="closeModalBtn" type="button">Close</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="activityModal">
      <div class="modal">
        <h3>Activity</h3>
        <div class="activity-list" id="activityList"></div>
        <div class="modal-actions">
          <button id="closeActivityBtn" type="button">Close</button>
        </div>
      </div>
    </div>

    <script>
      const runBtn = document.getElementById("runBtn");
      const moreBtn = document.getElementById("moreBtn");
      const statusEl = document.getElementById("status");
      const resultsEl = document.getElementById("results");
      const conversationList = document.getElementById("conversationList");
      const authModal = document.getElementById("authModal");
      const emailInput = document.getElementById("email");
      const codeInput = document.getElementById("code");
      const codeBtn = document.getElementById("codeBtn");
      const sendCodeBtn = document.getElementById("sendCodeBtn");
      const closeModalBtn = document.getElementById("closeModalBtn");
      const authStatus = document.getElementById("authStatus");
      const buyBtnTop = document.getElementById("buyBtnTop");
      const signInBtn = document.getElementById("signInBtn");
      const userMenu = document.getElementById("userMenu");
      const userBtn = document.getElementById("userBtn");
      const userMenuList = document.getElementById("userMenuList");
      const activityBtn = document.getElementById("activityBtn");
      const buyBtnMenu = document.getElementById("buyBtnMenu");
      const signOutBtn = document.getElementById("signOutBtn");
      const activityModal = document.getElementById("activityModal");
      const activityList = document.getElementById("activityList");
      const closeActivityBtn = document.getElementById("closeActivityBtn");

      let state = {
        email: localStorage.getItem("email") || "",
        token: localStorage.getItem("authToken") || "",
        known: false,
        selectedDebateId: null,
        session: "",
        debates: [],
      };

      emailInput.value = state.email;

      function clearResults() {
        resultsEl.innerHTML = "";
      }

      function addTurn(title, text, isSummary = false) {
        const card = document.createElement("div");
        card.className = "turn" + (isSummary ? " summary" : "");
        const header = document.createElement("h3");
        header.textContent = title;
        const body = document.createElement("div");
        body.textContent = text;
        card.appendChild(header);
        card.appendChild(body);
        resultsEl.appendChild(card);
      }

      function setAuthUI() {
        if (state.token) {
          signInBtn.style.display = "none";
          userMenu.style.display = "block";
          userBtn.textContent = state.email || "Account";
        } else {
          signInBtn.style.display = "block";
          userMenu.style.display = "none";
        }
      }

      async function checkEmail() {
        const email = emailInput.value.trim().toLowerCase();
        state.email = email;
        localStorage.setItem("email", email);
        if (!email) {
          state.known = false;
          setAuthUI();
          conversationList.innerHTML = '<div class="status">Enter an email to load history.</div>';
          return;
        }
        const resp = await fetch("/api/auth/status", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await resp.json();
        state.known = !!data.known;
        if (!state.known) {
          state.token = "";
          localStorage.removeItem("authToken");
        }
        setAuthUI();
        if (state.known && !state.token) {
          conversationList.innerHTML = '<div class="status">Sign in to load history.</div>';
        } else {
          await loadConversations();
        }
      }

      async function sendCode() {
        if (!state.email) return;
        const resp = await fetch("/api/auth/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: state.email }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          authStatus.textContent = data.error || "Failed to send code.";
          return;
        }
        state.session = data.session || "";
        authStatus.textContent = "Code sent.";
      }

      async function verifyCode() {
        if (!state.email || !codeInput.value.trim()) return;
        const resp = await fetch("/api/auth/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: state.email,
            code: codeInput.value.trim(),
            session: state.session || "",
          }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          authStatus.textContent = data.error || "Verification failed.";
          return;
        }
        state.token = data.id_token;
        localStorage.setItem("authToken", data.id_token);
        authStatus.textContent = "Verified.";
        authModal.style.display = "none";
        setAuthUI();
        await loadConversations();
      }

      async function loadConversations() {
        if (!state.email) return;
        const resp = await fetch(`/api/debates?email=${encodeURIComponent(state.email)}`, {
          headers: state.token ? { Authorization: `Bearer ${state.token}` } : {},
        });
        const data = await resp.json();
        if (!resp.ok) {
          conversationList.innerHTML = `<div class="status">${data.error || "Failed to load"}</div>`;
          return;
        }
        conversationList.innerHTML = "";
        const list = data.debates || [];
        state.debates = list;
        if (!list.length) {
          conversationList.innerHTML = '<div class="status">No conversations yet.</div>';
          return;
        }
        list.forEach((item) => {
          const el = document.createElement("div");
          el.className = "conversation" + (item.debate_id === state.selectedDebateId ? " active" : "");
          el.innerHTML = `
            <div class="conversation-title">${item.topic || "Untitled"}</div>
            <div class="conversation-meta">${item.turn_count || 0} turns</div>
          `;
          el.addEventListener("click", () => selectConversation(item.debate_id));
          conversationList.appendChild(el);
        });
      }

      async function selectConversation(debateId) {
        state.selectedDebateId = debateId;
        await loadConversations();
        if (!debateId) return;
        const resp = await fetch(
          `/api/debate?email=${encodeURIComponent(state.email)}&debate_id=${encodeURIComponent(debateId)}`,
          { headers: state.token ? { Authorization: `Bearer ${state.token}` } : {} }
        );
        const data = await resp.json();
        if (!resp.ok) {
          statusEl.textContent = data.error || "Failed to load debate.";
          return;
        }
        clearResults();
        data.turns.forEach((turn, idx) => addTurn(`Turn ${idx + 1} | ${turn.speaker}`, turn.text));
        if (data.summary) {
          addTurn("Moderator Summary", data.summary, true);
        }
      }

      runBtn.addEventListener("click", async () => {
        const topic = document.getElementById("topic").value.trim();
        if (!topic) {
          statusEl.textContent = "Please enter a topic.";
          return;
        }
        if (!state.email) {
          statusEl.textContent = "Email is required.";
          authModal.style.display = "flex";
          return;
        }
        if (state.known && !state.token) {
          statusEl.textContent = "Please sign in.";
          authModal.style.display = "flex";
          return;
        }

        runBtn.disabled = true;
        statusEl.textContent = "Running...";
        clearResults();

        try {
          const resp = await fetch("/api/debate/run", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              ...(state.token ? { Authorization: `Bearer ${state.token}` } : {}),
            },
            body: JSON.stringify({
              topic,
              email: state.email,
            }),
          });

          const data = await resp.json();
          if (!resp.ok) {
            if (data.error === "credits_required") {
            throw new Error("Credits required. Click Buy credits.");
            }
            throw new Error(data.error || "Request failed");
          }

          data.turns.forEach((turn, idx) => {
            addTurn(`Turn ${idx + 1} | ${turn.speaker}`, turn.text);
          });

          if (data.summary) {
            addTurn("Moderator Summary", data.summary, true);
          }

          statusEl.textContent = "Done.";
          state.selectedDebateId = data.debate_id;
          await loadConversations();
        } catch (err) {
          statusEl.textContent = err.message;
        } finally {
          runBtn.disabled = false;
        }
      });

      moreBtn.addEventListener("click", async () => {
        if (!state.selectedDebateId) {
          statusEl.textContent = "Select a conversation to continue.";
          return;
        }
        if (!state.email) {
          statusEl.textContent = "Email is required.";
          authModal.style.display = "flex";
          return;
        }
        if (state.known && !state.token) {
          statusEl.textContent = "Please sign in.";
          authModal.style.display = "flex";
          return;
        }
        runBtn.disabled = true;
        moreBtn.disabled = true;
        statusEl.textContent = "Continuing...";
        try {
          const resp = await fetch("/api/debate/run", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              ...(state.token ? { Authorization: `Bearer ${state.token}` } : {}),
            },
            body: JSON.stringify({
              email: state.email,
              debate_id: state.selectedDebateId,
              more: true,
            }),
          });
          const data = await resp.json();
          if (!resp.ok) {
            if (data.error === "credits_required") {
              throw new Error("Credits required. Click Buy credits.");
            }
            throw new Error(data.error || "Request failed");
          }
          clearResults();
          data.turns.forEach((turn, idx) => addTurn(`Turn ${idx + 1} | ${turn.speaker}`, turn.text));
          if (data.summary) {
            addTurn("Moderator Summary", data.summary, true);
          }
          statusEl.textContent = "Done.";
          await loadConversations();
        } catch (err) {
          statusEl.textContent = err.message;
        } finally {
          runBtn.disabled = false;
          moreBtn.disabled = false;
        }
      });

      function openAuthModal() {
        authModal.style.display = "flex";
        authStatus.textContent = "";
      }

      function closeAuthModal() {
        authModal.style.display = "none";
      }

      signInBtn.addEventListener("click", openAuthModal);
      closeModalBtn.addEventListener("click", closeAuthModal);
      sendCodeBtn.addEventListener("click", sendCode);
      codeBtn.addEventListener("click", verifyCode);
      buyBtnTop.addEventListener("click", async () => {
        if (!state.email) {
          openAuthModal();
          return;
        }
        const resp = await fetch("/api/stripe/checkout", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            ...(state.token ? { Authorization: `Bearer ${state.token}` } : {}),
          },
          body: JSON.stringify({
            email: state.email,
            success_url: window.location.href,
            cancel_url: window.location.href,
          }),
        });
        const data = await resp.json();
        if (!resp.ok || !data.url) {
          statusEl.textContent = data.error || "Checkout failed.";
          return;
        }
        window.location.href = data.url;
      });

      buyBtnMenu.addEventListener("click", () => buyBtnTop.click());
      activityBtn.addEventListener("click", () => {
        activityList.innerHTML = "";
        if (!state.debates.length) {
          activityList.innerHTML = '<div class="status">No conversations yet.</div>';
        } else {
          state.debates.forEach((item) => {
            const el = document.createElement("div");
            el.className = "conversation";
            el.innerHTML = `
              <div class="conversation-title">${item.topic || "Untitled"}</div>
              <div class="conversation-meta">${item.turn_count || 0} turns</div>
            `;
            el.addEventListener("click", () => {
              activityModal.style.display = "none";
              selectConversation(item.debate_id);
            });
            activityList.appendChild(el);
          });
        }
        activityModal.style.display = "flex";
      });
      closeActivityBtn.addEventListener("click", () => {
        activityModal.style.display = "none";
      });
      signOutBtn.addEventListener("click", () => {
        state.token = "";
        localStorage.removeItem("authToken");
        setAuthUI();
        conversationList.innerHTML = '<div class="status">Sign in to load history.</div>';
      });
      userBtn.addEventListener("click", () => {
        userMenuList.style.display = userMenuList.style.display === "block" ? "none" : "block";
      });
      window.addEventListener("click", (event) => {
        if (!userMenu.contains(event.target)) {
          userMenuList.style.display = "none";
        }
      });

      emailInput.addEventListener("change", checkEmail);
      checkEmail();
    </script>
  </body>
</html>
